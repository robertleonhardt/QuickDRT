<!doctype html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1">
    	<meta name="color-scheme" content="light dark">
        <script src="js/dropzone.min.js" defer></script>
        <script src="js/plotly-3.3.0.min.js" defer></script>
        <script src="js/parser.js" defer></script>
        <script src="js/matrix.umd.min.js" defer></script>
        <script src="js/nnls.js" defer></script>
        <script src="js/jsdrt.js" defer></script>
        <script src="js/main.js" defer></script>
    	<link rel="stylesheet" href="css/pico.cyan.min.css">
        <link rel="stylesheet" href="css/pico.colors.min.css">
        <link rel="stylesheet" href="css/dropzone.min.css">
		<link rel="stylesheet" href="css/main.css">
    	<title>QuickDRT</title>
	</head>
	<body>
		<header class="container-fluid">
			<nav>
				<ul>
					<li><h1>QuickDRT</h1></li>
                    <li><h2>Basis function DRT demo</h2></li>
				</ul>
				<ul>
                    <li><a href="#">About</a></li>
					<li><a href="https://github.com/robertleonhardt/QuickDRT" target="_blank">GitHub project</a></li>
				</ul>
			</nav>
		</header>
    	<main class="container-fluid">
       		<div class="grid main-grid">
        		<div class="left-pane">
                    <details name="upload" open>
                        <summary>Select EIS data</summary>
                        <form action="#" class="dropzone" id="eisupload"></form>
                    </details>
                    
                    <hr />
                    
                    <details name="details" id="testdetails">
                        <summary>Test details</summary>
                        <article>
                            <dl class="metadata">
                                <dt>File name</dt>
                                <dd id="metadata-filename">N/A</dd>

                                <dt>Test label</dt>
                                <dd id="metadata-label">N/A</dd>

                                <dt>Date</dt>
                                <dd id="metadata-date">N/A</dd>
                            </dl>
                        </article>
                    </details>
                    
                    <hr />
                    
                    <details name="config">
                        <summary>Options</summary>
                        <article>
                            <fieldset>
                                <label>
                                    <input name="treimInductivePart" id="config-trimInductivePart" type="checkbox" role="switch" checked/>
                                    Trim inductive impedance data
                                </label>
                            </fieldset>

                            <hr />

                            <select name="select" aria-label="Select" required>
                                <option selected value="basis-db">Debye basis (classic regularization DRT)</option>
                                <option value="basis-ga">Gaussian basis</option>
                                <option selected value="basis-cc" selected>Cole-Cole basis (recommended)</option>
                                <option value="basis-hn">Havriliak-Negami basis</option>
                            </select>

                            <label>
                                DRT shape parameter (α): <span class="param" id="configval-alpha">N/A</span>
                                <input type="range" id="config-alpha" min="0.5" max="0.99", step="0.01" value="0.92"/>
                            </label>

                            <hr />
                            
                            <label>
                                Minimum time constant (in seconds): <span class="param" id="configval-tauMin">N/A</span>
                                <input type="range" id="config-tauMin" min="-6" max="6", step="1" value="-3"/>
                            </label>
                            <label>
                                Maximum time constant (in seconds): <span class="param" id="configval-tauMax">N/A</span>
                                <input type="range" id="config-tauMax" min="-6" max="6", step="1" value="6"/>
                            </label>
                            <small id="tau-warning" class="warning" hidden>
                                Note: DRT computation collapses for τ<sub>min</sub> ≥ τ<sub>max</sub>
                            </small>

                            <hr />
                            
                            <label>
                                DRT resolution (points per decade): <span class="param" id="configval-ppd">N/A</span>
                                <input type="range" id="config-ppd" min="10" max="200", step="10" value="40"/>
                            </label>
                        </article>
                    </details>

                    <hr />

                    <details name="export">
                        <summary>Data export</summary>
                        <article>
                            <!-- <fieldset>
                                <legend>Export settings</legend>
                                <label>
                                    <input type="checkbox" name="export-eis" checked>
                                    Export EIS data (incl. processes)
                                </label>
                                <label>
                                    <input type="checkbox" name="export-drt" checked>
                                    Export DRT data (incl. processes)
                                </label>
                            </fieldset> -->
                            <button class="primary export" id="export-eis" disabled><svg width="20" height="20"><use href="#icon-download"></use></svg>Export EIS data</button>
                            <button class="primary export" id="export-drt" disabled><svg width="20" height="20"><use href="#icon-download"></use></svg>Export DRT data</button>
                        </article>
                    </details>

					
				</div>
        		<div class="right-pane">
                    <div id="eisplot" class="eisplot"></div>
                    <div id="drtplot" class="eisplot"></div>
                    <div id="drt-process-tooltip"></div>
                </div>
       		</div>
		</main>

		<!-- Some icons -->
		<svg style="display:none">
			<symbol id="icon-add" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-align-horizontal-distribute-center-icon lucide-align-horizontal-distribute-center">
				<circle cx="12" cy="12" r="10"/>
				<path d="M8 12h8"/>
				<path d="M12 8v8"/>
			</symbol>

			<symbol id="icon-del" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-align-horizontal-distribute-center-icon lucide-align-horizontal-distribute-center">
				<path d="M10 11v6"/>
				<path d="M14 11v6"/>
				<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
				<path d="M3 6h18"/>
				<path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
			</symbol>

            <symbol id="icon-download" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-align-horizontal-distribute-center-icon lucide-align-horizontal-distribute-center">
				<path d="M12 15V3"/>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="m7 10 5 5 5-5"/>
			</symbol>

			<symbol id="icon-edit" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-align-horizontal-distribute-center-icon lucide-align-horizontal-distribute-center">
				<path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
				<circle cx="12" cy="12" r="3"/>
			</symbol>

            <symbol id="icon-info" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-align-horizontal-distribute-center-icon lucide-align-horizontal-distribute-center">
				<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
			</symbol>

        </svg>

        <!-- Layout for added files -->
         <template id="dz-template">
            <div class="dz-preview"><span data-dz-name></span></div>
         </template>

	</body>
</html>
